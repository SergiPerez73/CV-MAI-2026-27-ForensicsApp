[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensics-app"
version = "0.1.0"
description = "Extensible Tkinter starter for an MSc Computer Vision course"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13", "matplotlib>=3.8", "scikit-image>=0.22", "scipy>=1.10", "opencv-python>=4.8.1", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
cnn = ["tensorflow>=2.16,<3"]
projection = ["umap-learn>=0.5,<0.6"]

[tool.setuptools.packages.find]
include = ["forensics_app*"]
